<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 知食 NutriMind：碗形容器 + 同心思维纹理 + 右上智能指示点
       主色 青柠 #C6F24E（填充） / 墨 #23231F（图形），底不做渐变，保证 16px 仍可辨识 -->
  <rect width="64" height="64" rx="15" fill="#C6F24E"/>
  <!-- 碗：下弧收口的半圆轮廓 -->
  <path d="M12 32 H52 A20 20 0 0 1 12 32 Z" fill="#23231F"/>
  <!-- 内部同心半弧：认知 / 思维纹理 -->
  <g fill="none" stroke="#C6F24E" stroke-width="2.6" stroke-linecap="round">
    <path d="M45.5 32 A13.5 13.5 0 0 1 18.5 32"/>
    <path d="M41.5 32 A9.5 9.5 0 0 1 22.5 32"/>
    <path d="M37.5 32 A5.5 5.5 0 0 1 26.5 32"/>
  </g>
  <!-- 智能指示点 -->
  <circle cx="46.5" cy="17" r="3.8" fill="#23231F"/>
</svg>
